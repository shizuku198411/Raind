name: Raind Smoke Test

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect source changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.detect.outputs.source }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect source-impacting changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # For manual runs and merge queue runs, execute the full smoke test.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | tee /tmp/changed-files.txt

          if grep -Eq '^(cmd/|internal/|scripts/|go\.mod$|go\.sum$|VERSION$|workshop\.yaml$|\.github/workflows/smoke_test\.yml$)' /tmp/changed-files.txt; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        shell: bash
        run: |
          echo "source-impacting changes: ${{ steps.detect.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"

  unit-test:
    name: unit test
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30

    steps:
      - name: Skip notice
        if: needs.changes.outputs.source != 'true'
        run: echo "No source-impacting changes; skipping unit test." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: needs.changes.outputs.source == 'true'
        uses: actions/checkout@v6

      - name: Check WORKSHOP_TOKEN
        if: needs.changes.outputs.source == 'true'
        shell: bash
        run: |
          if [ -z "${WORKSHOP_TOKEN}" ]; then
            echo "WORKSHOP_TOKEN is empty"
            exit 1
          fi
          echo "WORKSHOP_TOKEN is set"
        env:
          WORKSHOP_TOKEN: ${{ secrets.WORKSHOP_TOKEN }}

      - name: Check token access to canonical/workshop
        if: needs.changes.outputs.source == 'true'
        shell: bash
        run: |
          status="$(
            curl -sS -o /tmp/workshop-repo.json -w '%{http_code}' \
              -H "Authorization: Bearer ${WORKSHOP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/canonical/workshop
          )"
          echo "GitHub API status: ${status}"
          if [ "${status}" != "200" ]; then
            cat /tmp/workshop-repo.json
            exit 1
          fi
        env:
          WORKSHOP_TOKEN: ${{ secrets.WORKSHOP_TOKEN }}

      - name: Workshop Checkout
        if: needs.changes.outputs.source == 'true'
        uses: canonical/launch-workshop@v0
        with:
          token: ${{ secrets.WORKSHOP_TOKEN }}
          workshop: raind-dev

      - name: Test on Workshop
        if: needs.changes.outputs.source == 'true'
        run: workshop run raind-dev -- test-unit

  integ-test:
    name: integ test
    runs-on: ubuntu-latest
    needs: [changes, unit-test]
    if: always()
    timeout-minutes: 30

    steps:
      - name: Skip notice
        if: needs.changes.outputs.source != 'true'
        run: echo "No source-impacting changes; skipping integration test." >> "$GITHUB_STEP_SUMMARY"

      - name: Stop if unit test failed
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result != 'success'
        run: |
          echo "unit test did not succeed; refusing to run integration test"
          exit 1

      - name: Checkout
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result == 'success'
        uses: actions/checkout@v6

      - name: Check WORKSHOP_TOKEN
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result == 'success'
        shell: bash
        run: |
          if [ -z "${WORKSHOP_TOKEN}" ]; then
            echo "WORKSHOP_TOKEN is empty"
            exit 1
          fi
          echo "WORKSHOP_TOKEN is set"
        env:
          WORKSHOP_TOKEN: ${{ secrets.WORKSHOP_TOKEN }}

      - name: Check token access to canonical/workshop
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result == 'success'
        shell: bash
        run: |
          status="$(
            curl -sS -o /tmp/workshop-repo.json -w '%{http_code}' \
              -H "Authorization: Bearer ${WORKSHOP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/canonical/workshop
          )"
          echo "GitHub API status: ${status}"
          if [ "${status}" != "200" ]; then
            cat /tmp/workshop-repo.json
            exit 1
          fi
        env:
          WORKSHOP_TOKEN: ${{ secrets.WORKSHOP_TOKEN }}

      - name: Workshop Checkout
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result == 'success'
        uses: canonical/launch-workshop@v0
        with:
          token: ${{ secrets.WORKSHOP_TOKEN }}
          workshop: raind-dev

      - name: Integration Tests
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result == 'success'
        run: workshop run raind-dev -- dev-cleanup && workshop run raind-dev -- test-integ

  e2e-test:
    name: e2e test
    runs-on: ubuntu-latest
    needs: [changes, unit-test, integ-test]
    if: always()
    timeout-minutes: 30

    steps:
      - name: Skip notice
        if: needs.changes.outputs.source != 'true'
        run: echo "No source-impacting changes; skipping e2e test." >> "$GITHUB_STEP_SUMMARY"

      - name: Stop if previous tests failed
        if: needs.changes.outputs.source == 'true' && (needs.unit-test.result != 'success' || needs.integ-test.result != 'success')
        run: |
          echo "unit or integration test did not succeed; refusing to run e2e test"
          exit 1

      - name: Checkout
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result == 'success' && needs.integ-test.result == 'success'
        uses: actions/checkout@v6

      - name: Check WORKSHOP_TOKEN
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result == 'success' && needs.integ-test.result == 'success'
        shell: bash
        run: |
          if [ -z "${WORKSHOP_TOKEN}" ]; then
            echo "WORKSHOP_TOKEN is empty"
            exit 1
          fi
          echo "WORKSHOP_TOKEN is set"
        env:
          WORKSHOP_TOKEN: ${{ secrets.WORKSHOP_TOKEN }}

      - name: Check token access to canonical/workshop
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result == 'success' && needs.integ-test.result == 'success'
        shell: bash
        run: |
          status="$(
            curl -sS -o /tmp/workshop-repo.json -w '%{http_code}' \
              -H "Authorization: Bearer ${WORKSHOP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/canonical/workshop
          )"
          echo "GitHub API status: ${status}"
          if [ "${status}" != "200" ]; then
            cat /tmp/workshop-repo.json
            exit 1
          fi
        env:
          WORKSHOP_TOKEN: ${{ secrets.WORKSHOP_TOKEN }}

      - name: Workshop Checkout
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result == 'success' && needs.integ-test.result == 'success'
        uses: canonical/launch-workshop@v0
        with:
          token: ${{ secrets.WORKSHOP_TOKEN }}
          workshop: raind-dev

      - name: E2E Tests
        if: needs.changes.outputs.source == 'true' && needs.unit-test.result == 'success' && needs.integ-test.result == 'success'
        run: workshop run raind-dev -- dev-cleanup && workshop run raind-dev -- test-e2e
