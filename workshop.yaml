name: raind-dev
base: ubuntu@24.04

sdks:
  - name: go
    channel: latest/stable

actions:
  test-droplet: |
    cd /project
    ./scripts/test/droplet.sh "$@"
  test-condenser: |
    cd /project
    ./scripts/test/condenser.sh "$@"
  test-raind: |
    cd /project
    ./scripts/test/raind.sh "$@"
  test-unit: |
    cd /project
    ./scripts/test/unit.sh "$@"
  test-droplet-e2e: |
    cd /project
    ./scripts/e2e/droplet.sh "$@"
  test-condenser-e2e: |
    cd /project
    ./scripts/e2e/condenser.sh "$@"
  test-raind-e2e: |
    cd /project
    ./scripts/e2e/raind.sh "$@"
  e2e: |
    cd /project
    ./scripts/e2e/droplet.sh "$@"
    ./scripts/e2e/condenser.sh "$@"
    ./scripts/e2e/raind.sh "$@"
  test: |
    cd /project
    ./scripts/test/unit.sh "$@"
