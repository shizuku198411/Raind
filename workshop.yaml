name: raind-dev
base: ubuntu@24.04

sdks:
  - name: go
    channel: latest/stable
  
  - name: project-raind-base

actions:
  bootstrap: |
    cd /project
    ./scripts/build.sh bootstrap "$@"
  build: |
    cd /project
    ./scripts/build.sh build "$@"
  install: |
    cd /project
    ./scripts/build.sh install "$@"
  enable-service: |
    cd /project
    ./scripts/build.sh enable-service "$@"
  all: |
    cd /project
    ./scripts/build.sh all "$@"
  test-droplet: |
    cd /project
    ./scripts/test/droplet.sh "$@"
  test-condenser: |
    cd /project
    ./scripts/test/condenser.sh "$@"
  test-raind: |
    cd /project
    ./scripts/test/raind.sh "$@"
  test-unit: |
    cd /project
    ./scripts/test/unit.sh "$@"
  test-droplet-integ: |
    cd /project
    ./scripts/integ/droplet.sh "$@"
  test-condenser-integ: |
    cd /project
    ./scripts/integ/condenser.sh "$@"
  test-raind-integ: |
    cd /project
    ./scripts/integ/raind.sh "$@"
  test-integ: |
    cd /project
    ./scripts/integ/droplet.sh "$@"
    ./scripts/integ/condenser.sh "$@"
    ./scripts/integ/raind.sh "$@"
  test-e2e: |
    cd /project
    ./scripts/e2e/raind.sh "$@"
  test-oci-runtime-tools: |
    cd /project
    ./scripts/oci/runtime_tools_validation.sh "$@"

  dev-install: |
    cd /project
    ./scripts/workshop/install.sh "$@"
  dev-start: |
    cd /project
    ./scripts/workshop/start.sh "$@"
  dev-setup: |
    cd /project
    ./scripts/workshop/install.sh "$@"
    ./scripts/workshop/start.sh "$@"
  dev-cleanup: |
    cd /project
    ./scripts/workshop/cleanup.sh "$@"
  dev-reset: |
    cd /project
    ./scripts/workshop/cleanup.sh "$@"
    ./scripts/workshop/start.sh "$@"
