apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: raind-webui-rs
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raind-webui
  template:
    metadata:
      name: raind-webui
      labels:
        app: raind-webui
    spec:
      volumes:
      - name: raind-run
        hostPath:
          path: /run/raind
      - name: raind-log
        hostPath:
          path: /var/log/raind
      - name: raind-cert
        hostPath:
          path: /etc/raind/cert/web
      containers:
      - name: webui
        image: raind-webui:latest
        env:
        - name: WEBUI_HOST
          value: 0.0.0.0
        - name: WEBUI_PORT
          value: "8080"
        - name: RAIND_UI_SOCKET_PATH
          value: /run/raind/ui.sock
        - name: RAIND_WEBUI_DB_HOST
          value: 127.0.0.1
        - name: RAIND_WEBUI_DB_PORT
          value: "3306"
        - name: RAIND_WEBUI_DB_NAME
          value: raind_webui
        - name: RAIND_WEBUI_DB_USER
          value: raind_webui
        - name: RAIND_WEBUI_DB_PASSWORD
          value: raind_webui
        - name: RAIND_WEBUI_BOOTSTRAP_USER
          value: admin
        - name: RAIND_WEBUI_BOOTSTRAP_PASSWORD
          value: P@ssw0rd
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: raind-run
          mountPath: /run/raind
          readOnly: true
        - name: raind-log
          mountPath: /var/log/raind
          readOnly: true
        - name: raind-cert
          mountPath: /etc/raind/cert/web
          readOnly: true
      - name: mysql
        image: mysql:8.4
        env:
        - name: MYSQL_DATABASE
          value: raind_webui
        - name: MYSQL_USER
          value: raind_webui
        - name: MYSQL_PASSWORD
          value: raind_webui
        - name: MYSQL_ROOT_PASSWORD
          value: root
---
apiVersion: v1
kind: Service
metadata:
  name: raind-webui-svc
  namespace: default
spec:
  selector:
    app: raind-webui
  ports:
  - port: 18080
    targetPort: 8080
    protocol: TCP
